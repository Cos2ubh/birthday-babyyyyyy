<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#04040e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="robots" content="noindex">
  <title>For Babyyyyyy ✦</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <script src="bg-stars.js"></script>

  <div class="page" id="mainPage">
    <div class="title-row">
      <span class="star-decor" style="font-size:1.7rem">✦</span>
      <h1>For Babyyyyyy</h1>
      <span class="star-decor" style="font-size:1.7rem;animation-delay:1.6s">✦</span>
    </div>
    <p class="lock-subtitle">this little world was made just for you 🌙</p>

    <div class="card fade-in" id="lockCard">
      <span class="lock-icon">🔐</span>
      <p class="lock-question">
        What was the room number of the place<br>where we spent our first night together?
      </p>
      <div class="input-row">
        <input type="text" id="secretInput" placeholder="type it here ✨"
               autocomplete="off" autocorrect="off" inputmode="text">
        <button class="btn" onclick="checkAnswer()">Enter ✦</button>
      </div>
      <p class="error-msg" id="errMsg">that's not it, silly 💫 try again!</p>
    </div>
  </div>

  <div class="burst-overlay" id="burstOverlay"></div>

  <script src="cursor-trail.js"></script>
  <script>
    // ── Replace the string below with the actual room number ──
    const ANSWER = 'YOUR_ROOM_NUMBER_HERE';

    const input  = document.getElementById('secretInput');
    const errMsg = document.getElementById('errMsg');
    const card   = document.getElementById('lockCard');

    input.addEventListener('keydown', e => { if (e.key === 'Enter') checkAnswer(); });

    function checkAnswer() {
      const val = input.value.trim().toLowerCase();
      if (val === ANSWER.toString().toLowerCase()) {
        onCorrect();
      } else {
        onWrong();
      }
    }

    function onCorrect() {
      // Block further interaction
      input.disabled = true;
      document.querySelector('.btn').disabled = true;

      burstStars();

      setTimeout(() => {
        document.getElementById('mainPage').style.animation =
          'pageExit 0.45s cubic-bezier(0.22,1,0.36,1) forwards';
      }, 300);

      setTimeout(() => { window.location.href = 'loading.html'; }, 800);
    }

    function onWrong() {
      card.classList.remove('shake');
      void card.offsetWidth; // reflow to restart animation
      card.classList.add('shake');
      errMsg.classList.add('show');
      input.value = '';
      setTimeout(() => errMsg.classList.remove('show'), 2600);
    }

    function burstStars() {
      const overlay = document.getElementById('burstOverlay');
      const syms    = ['✦','✧','⋆','🌟','💛','✨','💫'];
      for (let i = 0; i < 60; i++) {
        const el    = document.createElement('span');
        const angle = Math.random() * Math.PI * 2;
        const dist  = 90 + Math.random() * 220;
        el.className = 'burst-star';
        el.textContent = syms[Math.floor(Math.random() * syms.length)];
        el.style.setProperty('--bx', (Math.cos(angle) * dist) + 'px');
        el.style.setProperty('--by', (Math.sin(angle) * dist) + 'px');
        el.style.animationDelay = (Math.random() * 0.25) + 's';
        el.style.fontSize       = (Math.random() * 16 + 9) + 'px';
        overlay.appendChild(el);
      }
    }
  </script>
</body>
</html>
