<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#04040e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="robots" content="noindex">
  <title>A Letter ✦</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Letter sits directly on the star canvas — glass effect */
    .letter-envelope {
      background: rgba(6, 5, 20, 0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 215, 0, 0.18);
      border-radius: 18px;
      padding: 1.75rem 1.5rem;
      box-shadow: 0 0 60px rgba(0,0,0,0.5), 0 0 24px var(--gold-glow);
    }

    /* Night-sky header strip shown before letter opens */
    .sky-strip {
      width: 100%;
      height: 120px;
      border-radius: 10px;
      margin-bottom: 0.75rem;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,215,0,0.12);
    }

    /* Live star canvas cloned into the strip */
    .sky-strip canvas {
      position: absolute;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
    }

    .sky-strip-label {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--script);
      font-size: 1rem;
      color: rgba(255,215,0,0.75);
      text-shadow: 0 0 12px var(--gold-glow);
      letter-spacing: 0.05em;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <script src="bg-stars.js"></script>

  <div class="page">
    <div class="title-row" style="margin-bottom:0.4rem">
      <span class="star-decor" style="font-size:1.5rem">✦</span>
      <h2>A Letter</h2>
      <span class="star-decor" style="font-size:1.5rem;animation-delay:1.4s">✦</span>
    </div>
    <p class="open-hint">tap the envelope to unfold it ✦</p>

    <div class="letter-outer">
      <div class="letter-envelope">

        <span class="envelope-icon" id="envIcon" onclick="openLetter()">💌</span>

        <div class="letter-content" id="letterContent">

          <!-- Night sky strip using the live star background -->
          <div class="sky-strip" id="skyStrip">
            <div class="sky-strip-label">The Night of Our First Kiss ✦</div>
          </div>

          <!-- ── Paste the letter text here ── -->
          <div class="letter-text" id="letterText">YOUR_LETTER_HERE</div>

        </div>
      </div>
    </div>

    <div id="wishNav" style="opacity:0;transition:opacity 0.7s ease;margin-top:2rem;text-align:center">
      <p style="font-family:var(--script);font-size:1.3rem;color:var(--gold);text-shadow:0 0 16px var(--gold-glow)">
        Happy Birthday, Babyyyyyy 🌟
      </p>
    </div>
  </div>

  <script src="cursor-trail.js"></script>
  <script>
    // Mirror a live star animation into the sky strip
    (function () {
      const strip  = document.getElementById('skyStrip');
      const canvas = document.createElement('canvas');
      strip.prepend(canvas);
      const ctx = canvas.getContext('2d');
      let W, H;

      function resize() {
        W = canvas.width  = strip.offsetWidth;
        H = canvas.height = strip.offsetHeight;
      }
      resize();

      const stars = Array.from({ length: 120 }, () => ({
        x:     Math.random(),
        y:     Math.random(),
        r:     Math.random() * 1.2 + 0.2,
        phase: Math.random() * Math.PI * 2,
        speed: Math.random() * 0.014 + 0.004,
        cross: Math.random() < 0.15
      }));

      function draw(t) {
        ctx.clearRect(0, 0, W, H);
        const ts = t * 0.001;
        for (const s of stars) {
          const alpha = 0.15 + 0.85 * ((Math.sin(s.phase + ts * s.speed) + 1) / 2);
          if (s.cross) {
            ctx.font = `${s.r * 9}px serif`;
            ctx.fillStyle   = `rgba(255,215,0,${alpha * 0.65})`;
            ctx.shadowColor = `rgba(255,215,0,${alpha * 0.5})`;
            ctx.shadowBlur  = 4;
            ctx.fillText('✦', s.x * W, s.y * H);
            ctx.shadowBlur  = 0;
          } else {
            ctx.beginPath();
            ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255,249,200,${alpha})`;
            ctx.fill();
          }
        }
        requestAnimationFrame(draw);
      }
      requestAnimationFrame(draw);
    })();

    let opened = false;

    function openLetter() {
      if (opened) return;
      opened = true;

      const icon    = document.getElementById('envIcon');
      const content = document.getElementById('letterContent');

      icon.style.fontSize     = '1.6rem';
      icon.style.marginBottom = '1rem';
      icon.style.animation    = 'none';
      icon.style.cursor       = 'default';

      requestAnimationFrame(() => { content.classList.add('open'); });

      setTimeout(() => {
        const nav = document.getElementById('wishNav');
        nav.style.opacity       = '1';
        nav.style.pointerEvents = 'auto';
      }, 900);
    }

    function navigateTo(url) {
      document.body.style.animation = 'pageExit 0.4s cubic-bezier(0.22,1,0.36,1) forwards';
      setTimeout(() => { window.location.href = url; }, 420);
    }
  </script>
</body>
</html>
