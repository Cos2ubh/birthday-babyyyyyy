<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#04040e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="robots" content="noindex">
  <title>Our Memories 📸</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .polaroid-wrap { position: relative; }

    /* ── Play badge ───────────────────────────────────────── */
    .play-badge {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 0.3rem;
      background: rgba(0,0,0,0.3);
      border-radius: 2px;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .play-badge .pb-icon {
      width: 42px; height: 42px;
      background: rgba(255,255,255,0.18);
      border: 1.5px solid rgba(255,255,255,0.55);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; color: #fff;
      backdrop-filter: blur(4px);
    }
    .play-badge .pb-label {
      font-family: var(--script);
      font-size: 0.72rem;
      color: rgba(255,255,255,0.8);
    }
    .polaroid:hover .play-badge,
    .polaroid.playing .play-badge { opacity: 0; }

    /* ── Section divider ──────────────────────────────────── */
    .section-divider {
      width: 100%; max-width: 460px;
      margin: 2.5rem 0 0.25rem;
      text-align: center;
    }
    .section-divider h3 {
      font-family: var(--script);
      font-size: 1.5rem;
      color: var(--pink);
      text-shadow: 0 0 12px var(--pink-glow);
      font-style: normal;
    }
    .section-divider .divider-line {
      display: flex; align-items: center;
      gap: 0.75rem; margin-top: 0.4rem;
      color: rgba(255,107,157,0.35); font-size: 0.75rem;
    }
    .section-divider .divider-line::before,
    .section-divider .divider-line::after {
      content: ''; flex: 1; height: 1px;
      background: rgba(255,107,157,0.25);
    }

    /* ── Lightbox ─────────────────────────────────────────── */
    .lightbox {
      position: fixed; inset: 0; z-index: 9000;
      background: rgba(0,0,0,0.96);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s cubic-bezier(0.22,1,0.36,1);
      touch-action: pan-y;
    }
    .lightbox.open { opacity: 1; pointer-events: auto; }

    .lb-inner {
      position: relative;
      max-width: 100vw; max-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.25s ease;
    }
    .lb-inner img,
    .lb-inner video {
      max-width: 100vw;
      max-height: 92dvh;
      object-fit: contain;
      border-radius: 4px;
      display: block;
    }

    .lb-close {
      position: fixed; top: 1.1rem; right: 1.1rem;
      width: 40px; height: 40px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 50%;
      color: #fff; font-size: 1.1rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; z-index: 9001;
      backdrop-filter: blur(6px);
      -webkit-tap-highlight-color: transparent;
    }

    .lb-hint {
      position: fixed; bottom: 1.5rem; left: 50%;
      transform: translateX(-50%);
      font-family: var(--script);
      font-size: 0.85rem;
      color: rgba(255,255,255,0.4);
      pointer-events: none;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <script src="bg-stars.js"></script>

  <div class="page" style="padding-bottom:4rem">
    <div class="title-row">
      <span class="star-decor" style="font-size:1.5rem">✦</span>
      <h2>Our Story in Pictures</h2>
      <span class="star-decor" style="font-size:1.5rem;animation-delay:1.4s">✦</span>
    </div>
    <h3 style="margin-bottom:1.4rem">double-tap or hold to open ♡</h3>

    <div class="wall-grid" id="mainGrid"></div>

    <div class="section-divider">
      <h3>sorry for these 😭</h3>
      <div class="divider-line">✦</div>
    </div>

    <div class="wall-grid" id="uglyGrid"></div>

    <div class="nav-bottom">
      <button class="btn" onclick="navigateTo('flipbook.html')">Why I Love You ✦</button>
    </div>
  </div>

  <!-- ── Lightbox ───────────────────────────────────────────── -->
  <div class="lightbox" id="lightbox">
    <button class="lb-close" onclick="closeLightbox()">✕</button>
    <div class="lb-inner" id="lbInner"></div>
    <p class="lb-hint">swipe down to close</p>
  </div>

  <script src="cursor-trail.js"></script>
  <script>
    const mainItems = [
      { src: 'images/photo1.jpg'  },
      { src: 'images/photo2.jpg'  },
      { src: 'images/photo3.jpg'  },
      { src: 'images/photo7.jpg'  },
      { src: 'images/photo8.jpg'  },
      { src: 'images/photo9.jpg'  },
      { src: 'images/photo10.jpg' },
      { src: 'images/photo11.jpg', caption: 'mommmyyyyy 🐻', video: 'videos/vid1.mp4' },
      { src: 'images/photo12.jpg',                            video: 'videos/vid2.mp4' },
      { src: 'images/photo13.jpg',                            video: 'videos/vid3.mp4' },
      { src: 'images/photo14.jpg',                            video: 'videos/vid4.mp4' },
      { src: 'images/photo15.jpg',                            video: 'videos/vid5.mp4' },
    ];

    const uglyItems = [
      { src: 'images/photo4.jpg' },
      { src: 'images/photo5.jpg' },
      { src: 'images/photo6.jpg' },
    ];

    const rotations = [-3.2,2.4,-1.8,3.1,-2.6,1.9,-2.1,3.4,-1.5,2.8,-3.0,1.6,-2.3,2.9,-1.2];

    // ── Lightbox ───────────────────────────────────────────────
    const lb      = document.getElementById('lightbox');
    const lbInner = document.getElementById('lbInner');

    function openLightbox(item) {
      lbInner.innerHTML = '';

      if (item.video) {
        const vid = document.createElement('video');
        vid.src         = item.video;
        vid.controls    = true;
        vid.autoplay    = true;
        vid.loop        = true;
        vid.playsInline = true;
        vid.setAttribute('playsinline', '');
        vid.setAttribute('webkit-playsinline', '');
        // Try unmuted first; iOS may block it silently
        vid.muted = false;
        lbInner.appendChild(vid);
        vid.play().catch(() => { vid.muted = true; vid.play().catch(() => {}); });
      } else {
        const img = document.createElement('img');
        img.src = item.src;
        lbInner.appendChild(img);
      }

      lb.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lb.classList.remove('open');
      document.body.style.overflow = '';
      // Let fade finish before clearing
      setTimeout(() => {
        const vid = lbInner.querySelector('video');
        if (vid) vid.pause();
        lbInner.innerHTML = '';
      }, 320);
    }

    // Close on backdrop tap (not on content)
    lb.addEventListener('click', e => { if (e.target === lb) closeLightbox(); });

    // Swipe down to close
    let lbStartY = 0;
    lb.addEventListener('touchstart', e => { lbStartY = e.touches[0].clientY; }, { passive: true });
    lb.addEventListener('touchend', e => {
      if (e.changedTouches[0].clientY - lbStartY > 75) closeLightbox();
    }, { passive: true });

    // ── Build polaroid grid ────────────────────────────────────
    function buildGrid(items, gridEl, offset) {
      items.forEach((p, i) => {
        const wrap = document.createElement('div');
        wrap.className = 'polaroid polaroid-wrap' + (p.caption ? ' has-caption' : '');
        wrap.style.setProperty('--rot',   rotations[(i + offset) % rotations.length] + 'deg');
        wrap.style.setProperty('--delay', (i * 0.1 + 0.15) + 's');

        const cap = p.caption ? document.createElement('p') : null;
        if (cap) { cap.className = 'polaroid-caption'; cap.textContent = p.caption; }

        // ── Gesture detection (shared) ─────────────────────────
        let touchStartY  = 0;
        let touchStartT  = 0;
        let lastTapT     = 0;
        let singleTapTimer = null;
        let longPressTimer = null;

        wrap.addEventListener('touchstart', e => {
          touchStartY = e.touches[0].clientY;
          touchStartT = Date.now();
          longPressTimer = setTimeout(() => openLightbox(p), 550);
        }, { passive: true });

        wrap.addEventListener('touchmove', () => {
          clearTimeout(longPressTimer);
        }, { passive: true });

        wrap.addEventListener('touchend', e => {
          clearTimeout(longPressTimer);
          const dy  = Math.abs(e.changedTouches[0].clientY - touchStartY);
          const dt  = Date.now() - touchStartT;
          if (dy > 10 || dt > 500) return; // scroll or long-press already fired

          const now   = Date.now();
          const since = now - lastTapT;
          lastTapT    = now;

          if (since < 280) {
            // Double tap → lightbox
            clearTimeout(singleTapTimer);
            openLightbox(p);
          } else {
            // Potential single tap — wait to confirm it's not a double
            singleTapTimer = setTimeout(() => {
              if (p.video) toggleVideo(wrap, p._vid);
            }, 280);
          }
        });

        // Desktop double-click → lightbox
        wrap.addEventListener('dblclick', () => openLightbox(p));

        // ── Video polaroid ─────────────────────────────────────
        if (p.video) {
          const vid = document.createElement('video');
          vid.className   = 'polaroid-img';
          vid.src         = p.video;
          vid.poster      = p.src;
          vid.muted       = true;
          vid.loop        = true;
          vid.playsInline = true;
          vid.preload     = 'none';
          vid.setAttribute('playsinline', '');
          vid.setAttribute('webkit-playsinline', '');
          p._vid = vid; // store ref for single-tap handler

          const badge = document.createElement('div');
          badge.className = 'play-badge';
          badge.innerHTML = '<div class="pb-icon">▶</div><span class="pb-label">tap to play</span>';

          // Desktop hover
          wrap.addEventListener('mouseenter', () => { vid.play().catch(() => {}); wrap.classList.add('playing'); });
          wrap.addEventListener('mouseleave', () => { vid.pause(); vid.currentTime = 0; wrap.classList.remove('playing'); });

          if (cap) wrap.append(vid, badge, cap); else wrap.append(vid, badge);

        } else {
          // ── Photo polaroid ─────────────────────────────────────
          const img = document.createElement('img');
          img.className = 'polaroid-img';
          img.src       = p.src;
          img.alt       = p.caption || '';
          img.loading   = 'lazy';
          img.onerror   = function () {
            this.remove();
            const ph = document.createElement('div');
            ph.className = 'polaroid-placeholder';
            ph.innerHTML = '<span>📷</span>drop a photo here';
            wrap.prepend(ph);
          };
          if (cap) wrap.append(img, cap); else wrap.append(img);
        }

        gridEl.appendChild(wrap);
      });
    }

    function toggleVideo(wrap, vid) {
      if (!vid) return;
      if (vid.paused) { vid.play().catch(() => {}); wrap.classList.add('playing'); }
      else { vid.pause(); vid.currentTime = 0; wrap.classList.remove('playing'); }
    }

    buildGrid(mainItems, document.getElementById('mainGrid'), 0);
    buildGrid(uglyItems, document.getElementById('uglyGrid'), mainItems.length);

    function navigateTo(url) {
      document.body.style.animation = 'pageExit 0.4s cubic-bezier(0.22,1,0.36,1) forwards';
      setTimeout(() => { window.location.href = url; }, 420);
    }
  </script>
</body>
</html>
