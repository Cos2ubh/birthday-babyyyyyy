<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#04040e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="robots" content="noindex">
  <title>Our Memories 📸</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .polaroid-wrap {
      position: relative;
    }
    .play-badge {
      position: absolute;
      top: 0.45rem;
      left: 0.45rem;
      background: rgba(0,0,0,0.55);
      border-radius: 50%;
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.7rem;
      color: #fff;
      backdrop-filter: blur(4px);
      pointer-events: none;
      transition: opacity 0.25s;
    }
    .polaroid:hover .play-badge,
    .polaroid.playing .play-badge { opacity: 0; }
  </style>
</head>
<body>
  <script src="bg-stars.js"></script>

  <div class="page">
    <div class="title-row">
      <span class="star-decor" style="font-size:1.5rem">✦</span>
      <h2>Our Story in Pictures</h2>
      <span class="star-decor" style="font-size:1.5rem;animation-delay:1.4s">✦</span>
    </div>
    <h3 style="margin-bottom:1.4rem">little snapshots of us ♡</h3>

    <div class="wall-grid" id="wallGrid"></div>

    <div class="nav-bottom">
      <button class="btn" onclick="navigateTo('flipbook.html')">Why I Love You ✦</button>
    </div>
  </div>

  <script src="cursor-trail.js"></script>
  <script>
    const items = [
      // ── Photos ────────────────────────────────────────────────
      { src: 'images/photo1.jpg'  },
      { src: 'images/photo2.jpg'  },
      { src: 'images/photo3.jpg'  },
      { src: 'images/photo7.jpg'  },
      { src: 'images/photo8.jpg'  },
      { src: 'images/photo9.jpg'  },
      { src: 'images/photo10.jpg' },
      { src: 'images/photo4.jpg'  },
      { src: 'images/photo5.jpg'  },
      { src: 'images/photo6.jpg'  },

      // ── Videos (hover to play) ─────────────────────────────────
      { src: 'images/photo11.jpg', caption: 'mommmyyyyy 🐻', video: 'videos/vid1.mp4' },
      { src: 'images/photo12.jpg',                            video: 'videos/vid2.mp4' },
      { src: 'images/photo13.jpg',                            video: 'videos/vid3.mp4' },
      { src: 'images/photo14.jpg',                            video: 'videos/vid4.mp4' },
      { src: 'images/photo15.jpg',                            video: 'videos/vid5.mp4' },
    ];

    const rotations = [-3.2,2.4,-1.8,3.1,-2.6,1.9,-2.1,3.4,-1.5,2.8,-3.0,1.6,-2.3,2.9,-1.2];
    const grid      = document.getElementById('wallGrid');

    items.forEach((p, i) => {
      const wrap = document.createElement('div');
      wrap.className = 'polaroid polaroid-wrap' + (p.caption ? ' has-caption' : '');
      wrap.style.setProperty('--rot',   rotations[i % rotations.length] + 'deg');
      wrap.style.setProperty('--delay', (i * 0.1 + 0.15) + 's');

      const cap = p.caption ? document.createElement('p') : null;
      if (cap) { cap.className = 'polaroid-caption'; cap.textContent = p.caption; }

      if (p.video) {
        // ── Video polaroid ───────────────────────────────────────
        const vid = document.createElement('video');
        vid.className   = 'polaroid-img';
        vid.src         = p.video;
        vid.poster      = p.src;
        vid.muted       = true;
        vid.loop        = true;
        vid.playsInline = true;
        vid.preload     = 'none';
        vid.setAttribute('playsinline', '');
        vid.setAttribute('webkit-playsinline', '');

        // Play badge (▶)
        const badge = document.createElement('div');
        badge.className   = 'play-badge';
        badge.textContent = '▶';

        // Desktop: hover to play
        wrap.addEventListener('mouseenter', () => {
          vid.play().catch(() => {});
          wrap.classList.add('playing');
        });
        wrap.addEventListener('mouseleave', () => {
          vid.pause();
          vid.currentTime = 0;
          wrap.classList.remove('playing');
        });

        // Mobile: tap to toggle play/pause
        let tapping = false;
        wrap.addEventListener('touchstart', () => {
          if (!tapping) {
            tapping = true;
            vid.play().catch(() => {});
            wrap.classList.add('playing');
          } else {
            tapping = false;
            vid.pause();
            vid.currentTime = 0;
            wrap.classList.remove('playing');
          }
        }, { passive: true });

        if (cap) wrap.append(vid, badge, cap);
        else     wrap.append(vid, badge);

      } else {
        // ── Photo polaroid ───────────────────────────────────────
        const img = document.createElement('img');
        img.className = 'polaroid-img';
        img.src       = p.src;
        img.alt       = p.caption || '';
        img.loading   = 'lazy';

        img.onerror = function () {
          this.remove();
          const ph = document.createElement('div');
          ph.className = 'polaroid-placeholder';
          ph.innerHTML = '<span>📷</span>drop a photo here';
          wrap.prepend(ph);
        };

        if (cap) wrap.append(img, cap);
        else     wrap.append(img);
      }

      grid.appendChild(wrap);
    });

    function navigateTo(url) {
      document.body.style.animation = 'pageExit 0.4s cubic-bezier(0.22,1,0.36,1) forwards';
      setTimeout(() => { window.location.href = url; }, 420);
    }
  </script>
</body>
</html>
